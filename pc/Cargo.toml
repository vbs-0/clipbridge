[package]
name = "clipbridge"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3.4"
png = "0.17"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
mdns-sd = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
